name: quality-gate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: greenhouse-hub/go.mod

      - name: Run hub tests
        working-directory: greenhouse-hub
        run: go test ./...

      - name: Run topology packer tests
        run: python -m unittest discover -s tools/topology/tests -p "test_*.py"

      - name: Run topology designer tests
        run: python -m unittest discover -s tools/topology_designer/tests -p "test_*.py"

      - name: Build hub Docker image
        run: docker build -f Dockerfile.hub .
